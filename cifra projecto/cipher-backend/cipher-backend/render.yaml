services:
  - type: web
    name: cipher-scanner-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: VIRUSTOTAL_API_KEY
        sync: false
      - key: GOOGLE_SAFE_BROWSING_API_KEY
        sync: false
      - key: HIBP_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
# Nota: o plano "free" do Render não inclui disco persistente.
# O arquivo SQLite (cipher.db) fica no sistema de arquivos efêmero do
# serviço: ele some quando o serviço reinicia, "dorme" por inatividade ou
# recebe um novo deploy. Para o histórico sobreviver entre reinícios,
# seria preciso migrar para um banco gerenciado (o próprio Render oferece
# PostgreSQL gratuito por tempo limitado) — posso te ajudar com isso
# quando o restante estiver funcionando.
